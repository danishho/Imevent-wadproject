{% extends 'base.html' %}
{% load static %}
{% block extra_head %}
    <link rel="stylesheet" href="{% static 'css/eventDetails.css' %}">
{% endblock %}
{% block content %}

    <div class="container-details">
        <div class="event-card">
            <!-- Event Image Section -->
            <div class="event-image">
                <img src="{{ event.image.url }}" alt="{{ event.title }}">
            </div>
            <!-- Event Details Section -->
            <div class="event-details">
                <!-- Event Title and Meta Information -->
                <h1 class="event-title">{{ event.title }}</h1>
                <p class="event-meta">{{ event.start_date }} - {{ event.end_date }} | {{ event.location }}</p>
                <!-- Event Description -->
                <p class="event-description">{{ event.description }}</p>

                <!-- Tickets Available (for display) -->
                <p class="event-meta">Tickets Available: {{ event.max_tickets }}</p>

                <!-- Book Now Button -->
                <div class="book-btn-container">
                    <a href="{% url 'Book' event.id %}" class="book-btn">Book Now</a>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
